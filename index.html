  <link rel="icon" type="image/png" href="/rm-monogram-logo-white.png" media="(prefers-color-scheme: dark)" />
  <script>
    (function () {
      const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
      function updateFavicon(e) {
        const icon = document.querySelector("link[rel*='icon']");
        if (icon) {
          icon.href = e.matches ? "/rm-monogram-logo-white.png" : "/rm-monogram-logo-dark.png";
        }
      }
      darkQuery.addEventListener("change", updateFavicon);
      updateFavicon(darkQuery);
    })();
  </script>
